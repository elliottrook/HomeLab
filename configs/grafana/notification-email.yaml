apiVersion: 1

contactPoints:
  - orgId: 1
    name: HomeLab email
    receivers:
      - uid: homelab-email
        type: email
        settings:
          addresses: jason@yampy.ca
          singleEmail: true
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: HomeLab email
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
