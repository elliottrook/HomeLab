apiVersion: 1

groups:
  - orgId: 1
    name: Aster Voice service
    folder: HomeLab Alerts
    interval: 30s
    rules:
      - uid: homelab-aster-voice-service
        title: Aster Voice service condition
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum by (alertname, severity) (ALERTS{alertname=~"AsterVoice.*",alertstate="firing"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Aster Voice: {{ $labels.alertname }}"
          description: "A debounced Aster Voice service condition is firing in Prometheus."
        labels:
          service: aster-voice
        isPaused: false
