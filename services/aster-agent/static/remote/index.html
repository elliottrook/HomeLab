<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aster Remote">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Aster Remote</title>
  <link rel="manifest" href="/remote/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/aster-app-icon.png">
  <link rel="stylesheet" href="/remote/styles.css">
</head>
<body>
  <main>
    <section id="login" class="login" hidden>
      <img src="/aster-app-icon.png" alt="" width="92" height="92">
      <h1>Aster Remote</h1>
      <p>Private control for your AsterTV.</p>
      <button id="signIn" class="gold">Sign in with passkey</button>
      <p id="loginError" class="error" role="alert"></p>
    </section>

    <section id="remote" hidden>
      <header class="app-header">
        <div class="brand">
          <img src="/aster-app-icon.png" alt="" width="42" height="42">
          <div><p class="kicker">AsterTV</p><h1>Remote</h1></div>
        </div>
        <span id="connection" class="status disconnected" role="status"><i aria-hidden="true"></i>Disconnected</span>
      </header>

      <form id="searchForm" class="search-strip" role="search">
        <label class="sr-only" for="search">Search AsterTV</label>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="search" maxlength="512" autocomplete="off" enterkeyhint="search" placeholder="Search AsterTV">
        <button type="button" id="voice" class="search-icon" aria-label="Voice search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"></path></svg>
        </button>
        <button type="submit" class="search-icon" aria-label="Submit search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </form>
      <p id="heard" class="heard" aria-live="polite"></p>

      <section class="control-panel" aria-label="Remote navigation">
        <div id="touchpad" class="touchpad" tabindex="0" role="button" aria-label="Touchpad: swipe to navigate, tap to select, hold for context menu">
          <img src="/aster-app-icon.png" alt="" width="42" height="42">
          <strong>Swipe to navigate</strong>
          <span>Tap to select · Hold for more</span>
        </div>
        <nav class="transport" aria-label="Primary remote controls">
          <button type="button" data-action="nav.back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" data-action="nav.home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"></path><path d="M5 10v10h14V10M9 20v-6h6v6"></path></svg></button>
          <button type="button" data-action="playback.toggle" class="primary" aria-label="Play or pause"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"></path></svg></button>
          <button type="button" id="moreOpen" aria-label="More controls" aria-expanded="false" aria-controls="moreSheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"></path></svg></button>
        </nav>
      </section>

      <section class="room-target" aria-label="Controlled AsterTV">
        <span class="room-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m8 2 4 3 4-3"></path></svg></span>
        <span class="room-copy"><small>Controlling</small><strong id="roomLabel">AsterTV</strong><span id="now" class="now"></span></span>
        <select id="room" aria-label="Choose AsterTV"></select>
        <svg class="room-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
      </section>

      <section id="moreSheet" class="more-sheet" hidden aria-label="More remote controls">
        <header class="sheet-header">
          <div><p class="kicker">Secondary controls</p><h2>More</h2></div>
          <button type="button" id="moreClose" aria-label="Close more controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </header>
        <div class="dpad" aria-label="Directional controls">
          <button data-action="nav.up" aria-label="Up">▲</button>
          <button data-action="nav.left" aria-label="Left">◀</button>
          <button data-action="nav.select" class="select" aria-label="Select">OK</button>
          <button data-action="nav.right" aria-label="Right">▶</button>
          <button data-action="nav.down" aria-label="Down">▼</button>
        </div>
        <form id="textForm" class="keyboard-form">
          <label for="text">Type into Kodi’s open keyboard</label>
          <div class="input-row">
            <input id="text" maxlength="512" autocomplete="off" autocapitalize="sentences" placeholder="Symbols and paste work here">
            <button type="submit" class="gold">Send</button>
          </div>
          <div class="text-actions">
            <button type="button" data-action="text.backspace">Backspace</button>
            <button type="button" data-action="text.clear">Clear</button>
            <button type="button" data-action="text.cancel">Cancel</button>
            <button type="button" data-action="text.enter">Enter</button>
          </div>
        </form>
        <section class="equipment" aria-label="Equipment controls unavailable">
          <div><p class="kicker">Room equipment</p><p>Volume, mute and power arrive with the M7 equipment bridge.</p></div>
          <div class="disabled-row" aria-disabled="true">
            <button disabled>Volume −</button><button disabled>Mute</button>
            <button disabled>Volume +</button><button disabled>Power</button>
          </div>
        </section>
        <button id="signOut" class="sign-out">Sign out</button>
      </section>

      <p id="error" class="error" role="alert"></p>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </main>
  <script src="/remote/app.js"></script>
</body>
</html>
