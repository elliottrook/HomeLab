# Explicitly disabled integration. Does not load/decrypt worker credentials.
[Service]
Environment=ASTER_DELEGATION_ENABLED=0
Environment=PYTHONDONTWRITEBYTECODE=1
ExecStart=
ExecStart=/opt/aster-agent/venv/bin/uvicorn aster_with_delegation:app --host 192.168.70.10 --port 9120 --workers 1 --no-access-log
