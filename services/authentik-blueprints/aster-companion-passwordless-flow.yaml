version: 1
metadata:
  name: aster-companion-passwordless-flow
entries:
  - model: authentik_flows.flow
    id: ac-flow
    identifiers:
      slug: aster-companion-passwordless
    attrs:
      name: Aster Companion passwordless login
      title: Sign in to Aster Companion
      designation: authentication
      authentication: require_unauthenticated
      policy_engine_mode: any
      compatibility_mode: false

  - model: authentik_stages_identification.identificationstage
    id: ac-ident-stage
    identifiers:
      name: aster-companion-identification
    attrs:
      user_fields:
        - email
        - username
      case_insensitive_matching: true
      show_matched_user: true
      pretend_user_exists: true
      show_source_labels: false
      enable_remember_me: false

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: ac-webauthn-stage
    identifiers:
      name: aster-companion-webauthn-validate
    attrs:
      device_classes:
        - webauthn
      not_configured_action: deny
      webauthn_user_verification: required
      last_auth_threshold: seconds=0

  - model: authentik_stages_user_login.userloginstage
    id: ac-login-stage
    identifiers:
      name: aster-companion-login
    attrs:
      session_duration: seconds=0
      terminate_other_sessions: false
      remember_me_offset: seconds=0
      geoip_binding: no_binding
      network_binding: no_binding
      remember_device: days=30

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf ac-flow
      stage: !KeyOf ac-ident-stage
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf ac-flow
      stage: !KeyOf ac-webauthn-stage
      order: 20
    attrs:
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf ac-flow
      stage: !KeyOf ac-login-stage
      order: 100
