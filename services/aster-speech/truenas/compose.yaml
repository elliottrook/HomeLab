services:
  renderer:
    build:
      context: .
      dockerfile: Dockerfile.kokopop-vulkan
    image: aster-kokopop-vulkan:2c6989ac
    command:
      - --model
      - /models/kokoro-v1_0.gguf
      - --voice
      - bm_daniel
      - --speed
      - "0.95"
      - --mode
      - adaptative
      - --threads
      - "4"
      - --backend
      - vulkan
      - --http
      - --bind
      - 0.0.0.0
      - --port
      - "18131"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${ASTER_RENDER_GID:?set the TrueNAS render group GID}"
    environment:
      XDG_CACHE_HOME: /tmp/cache
    volumes:
      - ${ASTER_VOICE_MODEL:?set the verified GGUF path}:/models/kokoro-v1_0.gguf:ro
    networks:
      - renderer
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 4
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:18131/health]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  bridge:
    build:
      context: ..
      dockerfile: truenas/Dockerfile.renderer-bridge
    image: aster-vulkan-renderer-bridge:20261010
    depends_on:
      renderer:
        condition: service_healthy
    environment:
      ASTER_RENDERER_LISTEN_HOST: 0.0.0.0
      ASTER_RENDERER_LISTEN_PORT: "9132"
      ASTER_RENDERER_UPSTREAM: http://renderer:18131/tts
      ASTER_RENDERER_KEY_FILE: /run/secrets/bridge.key
      ASTER_RENDERER_UPSTREAM_TIMEOUT: "15"
    ports:
      - 192.168.20.40:9132:9132
    volumes:
      - ${ASTER_RENDERER_KEY_FILE:?set the protected bridge key path}:/run/secrets/bridge.key:ro
    networks:
      - renderer
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - urllib.request.urlopen('http://127.0.0.1:9132/health',timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  renderer:
    internal: true
