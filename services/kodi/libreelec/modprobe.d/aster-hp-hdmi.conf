# HP ProDesk 400 G5 DM exposes its Intel HDMI codec pins as connectivity
# "N/A" even when the DisplayPort-to-HDMI sink is connected and advertises
# audio in EDID. Register all HDMI/DP codec pins so ALSA can create the HDMI
# PCM devices required by Kodi.
options snd_hda_codec_hdmi enable_all_pins=1
