{
  "schema_version": 1,
  "kind": "overlay",
  "id": "remote-client-v3",
  "owner": "fleet-engineering",
  "layer": "kodi-service",
  "compatible_releases": ["astertv-v2.0.7-2026-10-31"],
  "dependencies": ["release-guard-v1"],
  "targets": ["astertv-family", "astertv-bedroom", "astertv-jen"],
  "owns": ["kodi/service.asterremote", "kodi/native-input-sync"],
  "payload_sources": [
    "services/kodi/astertv-fleet/materialized/remote-client-v3/common",
    "services/kodi/astertv-fleet/materialized/remote-client-v3/materialization-manifest.json",
    "services/kodi/astertv-fleet/materialize_remote_client.py"
  ],
  "payload_target_sources": {
    "astertv-family": ["services/kodi/astertv-fleet/materialized/remote-client-v3/targets/astertv-family"],
    "astertv-bedroom": ["services/kodi/astertv-fleet/materialized/remote-client-v3/targets/astertv-bedroom"],
    "astertv-jen": ["services/kodi/astertv-fleet/materialized/remote-client-v3/targets/astertv-jen"]
  },
  "payload_status": "complete",
  "payload_blockers": [],
  "assertions": [
    {"authority": "kodi", "key": "addon.service.asterremote.enabled", "expected": true, "sensitive": false},
    {"authority": "filesystem", "key": "asterremote-client-key.mode", "expected": "0600", "sensitive": false}
  ],
  "secret_refs": ["remote-client-per-device"],
  "rollback_ref": "astertv-v3-m8 per-device and gateway checkpoints",
  "tests": ["services/kodi/astertv-v3/remote_client/test_remote_client.py"]
}
