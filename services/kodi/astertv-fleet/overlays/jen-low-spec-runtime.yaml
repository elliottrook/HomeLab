  "assertions": [
    {"authority": "kodi", "key": "audio.channels", "expected": "2.0", "sensitive": false},
    {"authority": "kodi", "key": "audio.passthrough", "expected": false, "sensitive": false},
    {"authority": "systemd", "key": "astertv-jen-jellyfin-policy.service", "expected": "enabled", "sensitive": false},
    {"authority": "systemd", "key": "astertv-jen-jellyfin-policy.path", "expected": "enabled-active", "sensitive": false},
    {"authority": "jellyfin-client", "key": "policy.mode", "expected": "selective", "sensitive": false},
    {"authority": "jellyfin-client", "key": "policy.max-bitrate-kbps", "expected": 18000, "sensitive": false},
    {"authority": "jellyfin-client", "key": "policy.hevc-direct-play-max-width", "expected": 1920, "sensitive": false},
    {"authority": "release-guard", "key": "accepted-file-count", "expected": 532, "sensitive": false},
    {"authority": "jellyfin-server", "key": "arc-a380-hwa", "expected": "hevc-vp9-av1-mpeg2-decode:intel-vpp:on:opencl:off", "sensitive": false}
  ],
  "secret_refs": ["jellyfin-jen-client"],
  "rollback_ref": "astertv-reliability-AsterTV-Jen accepted state",
  "tests": ["services/kodi/astertv-v3/low-spec/test_jellyfin_client_policy.py"]
}
