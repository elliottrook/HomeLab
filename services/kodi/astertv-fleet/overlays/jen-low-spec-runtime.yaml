{
  "schema_version": 1,
  "kind": "overlay",
  "id": "jen-low-spec-runtime",
  "owner": "fleet-engineering",
  "layer": "device-performance",
  "compatible_releases": ["astertv-v2.0.7-2026-10-31"],
  "dependencies": ["release-guard-v1"],
  "targets": ["astertv-jen"],
  "owns": ["kodi/playback/jen-1080p-stereo", "kodi/runtime/jen-host-gates", "jellyfin/client-policy-jen"],
  "payload_sources": [
    "services/kodi/astertv-fleet/materialized/jen-low-spec-runtime",
    "services/kodi/astertv-fleet/materialize_jen_low_spec_runtime.py"
  ],
  "payload_status": "complete",
