services:
  broker:
    image: astertv-podcast-request-broker:sa-m5p1
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: astertv-podcast-request-broker
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      ASTER_CLIENT_TOKENS: /run/aster-secrets/client-tokens.json
      AUDIOBOOKSHELF_API_KEY: /run/aster-secrets/audiobookshelf.key
      AUDIOBOOKSHELF_URL: http://unified-audiobookshelf-shadow
      ASTER_QUEUE_ROOT: /var/lib/aster-podcast-requests
      ASTER_LISTEN: 0.0.0.0
      ASTER_PORT: "8790"
    ports:
      - "192.168.20.40:8790:8790"
    volumes:
      - ./secrets/client-tokens.json:/run/aster-secrets/client-tokens.json:ro
      - ./secrets/audiobookshelf.key:/run/aster-secrets/audiobookshelf.key:ro
      - ./state:/var/lib/aster-podcast-requests:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532,mode=0700
    networks:
      - unified
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8790/health',timeout=2)); assert d=={'execution_enabled':False,'state':'ready'}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  unified:
    external: true
    name: unified-media-shadow_default
